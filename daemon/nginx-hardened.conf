# /etc/nginx/sites-available/default
# Hardened & URL-Masked Configuration for MEENA // Takahara Academy

server {
	listen 80 default_server;
	listen [::]:80 default_server;

	root /var/www/html;
	index index.html index.php index.htm;

	server_name "$hostname" dietpi.local localhost "";

	# --- SECURITY HARDENING & HEADERS ---
	server_tokens off;
	autoindex off;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-XSS-Protection "1; mode=block" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "microphone=(self)" always;

	# --- URL MASKING / CLEAN ROUTING ---
	location = /dashboard {
		try_files /index.html =404;
	}

	location = /settings {
		try_files /settings.html =404;
	}

	location = /bridge {
		try_files /index.html =404;
	}

	# --- CLEAN MASKED API ENDPOINTS ---
	location = /api/telemetry {
		default_type application/json;
		add_header Access-Control-Allow-Origin "*" always;
		add_header Cache-Control "no-store, no-cache, must-revalidate" always;
		alias /var/www/html/api.json;
	}

	location = /api/status {
		default_type application/json;
		add_header Access-Control-Allow-Origin "*" always;
		alias /var/www/html/api.json;
	}

	location = /api/calendar {
		default_type application/json;
		add_header Access-Control-Allow-Origin "*" always;
		alias /var/www/html/calendar_events.json;
	}

	location = /api/calendar/config {
		default_type application/json;
		add_header Access-Control-Allow-Origin "*" always;
		alias /var/www/html/calendar_config.json;
	}

	location = /api/hearth {
		default_type application/json;
		add_header Access-Control-Allow-Origin "*" always;
		alias /var/www/html/meenaHearth.json;
	}

	location = /api/memories {
		default_type application/json;
		add_header Access-Control-Allow-Origin "*" always;
		alias /var/www/html/knowledge_bank.json;
	}

	location = /api.php {
		default_type application/json;
		add_header Access-Control-Allow-Origin "*" always;
		alias /var/www/html/api.json;
	}

	# --- NEURAL SPEECH TTS REVERSE PROXY ---
	location /tts {
		proxy_pass http://127.0.0.1:8088/tts;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_http_version 1.1;
		proxy_buffering off;
	}

	location /api/tts {
		proxy_pass http://127.0.0.1:8088/tts;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_http_version 1.1;
		proxy_buffering off;
	}

	# --- PI-HOLE REVERSE PROXY ---
	location /admin/ {
		proxy_pass http://127.0.0.1:8089/admin/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_pass_header X-FTL-SID;
		proxy_http_version 1.1;
	}

	# --- SECURITY LOCKDOWN: BLOCK SENSITIVE FILES ---
	location ~ /\.(?!well-known).* {
		deny all;
		return 404;
	}

	location ~* \.(sh|py|service|md|env|git|bak|backup|log|sql|conf|ini)$ {
		deny all;
		return 404;
	}

	# --- STATIC ASSETS & SPA ROUTING ---
	location / {
		try_files $uri $uri/ /index.html =404;
	}
}
